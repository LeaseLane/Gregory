name: Déploiement des edge functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch: {}

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Déployer toutes les fonctions vers la production
        # Les sources vivent dans supabase/functions/<nom>/index.ts —
        # la structure attendue nativement par la CLI Supabase, donc
        # aucune étape de copie n'est nécessaire.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
