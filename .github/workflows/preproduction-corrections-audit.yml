name: Préproduction · corrections de l’audit (branche)

# Branche « corrections-audit » SEULEMENT : migrations et fonctions de cette branche en PRÉPRODUCTION, pour les essais et les
# captures (audit du 2026-11-06). Jamais la production : la référence de production est refusée. À retirer à la fusion.
on:
  push:
    branches: [corrections-audit]

jobs:
  preproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Migrations et fonctions en préproduction
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_REF: ${{ secrets.SUPABASE_STAGING_REF }}
          PROD_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          [ -n "${STAGING_REF:-}" ] || { echo "::error::SUPABASE_STAGING_REF absent."; exit 1; }
          [ "$STAGING_REF" != "${PROD_REF:-}" ] || { echo "::error::La référence de préproduction est celle de la production : refusé."; exit 1; }
          supabase link --project-ref "$STAGING_REF" --yes
          supabase db push --linked --include-all --yes
          supabase functions deploy --project-ref "$STAGING_REF"
