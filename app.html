<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lease Lane</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"></script>
<style>
  /* Palette retirée : voir assets/leaselane.css (couleurs du logo). */
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--police-texte);line-height:1.5;}
  #screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));}
  .box{width:100%;max-width:340px;padding:36px 30px;background:var(--paper-2);border:1px solid var(--line);}
  .box .brand{font-family:var(--police-titre);font-weight:600;font-size:24px;margin-bottom:2px;text-align:center;}
  .box .sub{font-family:var(--police-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:26px;text-align:center;}
  .box label{display:block;font-size:12.5px;font-weight:500;margin-bottom:6px;}
  .box .f{margin-bottom:14px;}
  .box input{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--paper);font-size:14px;font-family:var(--police-texte);}
  .box input:focus{outline:none;border-color:var(--brass);}
  .box button{width:100%;background:var(--ink);color:var(--paper);border:none;padding:13px;font-size:14px;font-weight:500;cursor:pointer;margin-top:8px;}
  .box button:hover{background:var(--brass-dark);}
  .box button:disabled{opacity:0.6;cursor:default;}
  .error{color:var(--rust);font-size:13px;margin-top:12px;display:none;text-align:center;}
  .loading{text-align:center;color:var(--muted);font-size:13.5px;}
</style>
<link rel="stylesheet" href="assets/leaselane.css">
</head>
<body>

<div id="screen">
  <div class="box" id="login-box">
    <div class="brand">Lease Lane</div>
    <div class="sub">Connexion</div>
    <div class="f"><label for="login-email">Courriel</label><input type="email" id="login-email" autocomplete="username"></div>
    <div class="f"><label for="login-password">Mot de passe</label><input type="password" id="login-password" autocomplete="current-password"></div>
    <button onclick="handleLogin()" id="login-btn">Se connecter</button>
    <p class="error" id="login-error"></p>
  </div>
  <div class="box" id="loading-box" style="display:none;">
    <p class="loading">Redirection vers ton portail...</p>
  </div>
</div>

<script src="assets/charger-portail.js"></script>
<script>
// Tout est dans une fonction : le portail chargé ensuite par llCharger()
// garde le même objet window et redéclare ses propres constantes.
(function(){
const SUPABASE_URL = 'https://kdmwfbcziokygfcmjxeq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_XJTO7hD6WHG9uK7Sg7LNDg_MM46QALR';
const CLE_SESSION = 'sb-kdmwfbcziokygfcmjxeq-auth-token';

// Portail déjà ouvert sur cet appareil : on le recharge directement, sous /app.
let dernier = null;
try { dernier = localStorage.getItem('ll-portail'); } catch(e){}
if(dernier){
  document.documentElement.style.visibility = 'hidden';
  llCharger(dernier).catch(() => { document.documentElement.style.visibility = ''; });
  return;
}

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Chaque portail garde sa session sous sa propre clé : on y recopie celle-ci
// pour ne pas redemander le mot de passe.
const PORTAIL = {
  owner:  ['portail-proprietaire', 'sb-portail-owner-auth'],
  tenant: ['portail-locataire',    'sb-portail-tenant-auth'],
  worker: ['portail-travailleur',  'sb-portail-worker-auth'],
  admin:  ['portail-admin',        'sb-portail-admin-auth'],
};

function showError(msg){
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}

async function routeToPortal(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session) return false;

  document.getElementById('login-box').style.display = 'none';
  document.getElementById('loading-box').style.display = 'block';

  let role = null;
  const { data } = await supabaseClient.functions.invoke('whoami');
  role = data?.role || null;
  // whoami ne connaît que propriétaire/locataire/travailleur ; admin-api
  // refuse tout compte qui n'est pas administrateur.
  if(!role){
    const { error } = await supabaseClient.functions.invoke('admin-api');
    if(!error) role = 'admin';
  }
  if(!role || !PORTAIL[role]){
    document.getElementById('loading-box').style.display = 'none';
    document.getElementById('login-box').style.display = 'block';
    showError(data?.error || "Ce compte n'est associé à aucun portail. Contacte l'équipe Lease Lane.");
    await supabaseClient.auth.signOut();
    return false;
  }
  const [nom, cle] = PORTAIL[role];
  try {
    localStorage.setItem(cle, localStorage.getItem(CLE_SESSION));
    localStorage.setItem('ll-portail', nom);
  } catch(e){}
  await llCharger(nom);
  return true;
}

window.handleLogin = async function(){
  const btn = document.getElementById('login-btn');
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  document.getElementById('login-error').style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Connexion...';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){
    btn.disabled = false;
    btn.textContent = 'Se connecter';
    showError(error.message);
    return;
  }
  await routeToPortal();
};

// Une session déjà active (app rouverte, ou session partagée depuis le
// site web sur le même domaine) saute directement le formulaire.
routeToPortal();
})();
</script>
</body>
</html>
