# Reproduit GitHub Pages : /page sert page.html, un chemin inconnu sert 404.html (le routeur des portails
# s'en sert pour les onglets en /<onglet>), cache de 10 minutes comme Pages.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  # 2026-11-03 : anciens liens des portails propriétaire et locataire (?p=…, branding.ts PORTAILS) → nouveaux portails.
  location = / {
    if ($arg_p ~ ^(proprietaire|locataire)$) { return 302 /espace/connexion?p=$arg_p; }
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=600";
  }
  location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "public, max-age=600";
  }
  error_page 404 /404.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
