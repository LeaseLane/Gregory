<script src="/assets/charger-portail.js?v=202610091900"></script>
<script>
// /<onglet> (ou l'ancien /app/<onglet>) n'existe pas comme fichier : on
// recharge le dernier portail ouvert, qui lit l'onglet dans l'adresse
// (assets/url-propre.js). Une adresse inconnue sans portail ouvert → /.
(function () {
  if (!/^\/(app\/)?[a-z0-9-]+\/?$/.test(location.pathname)) return;
  var p = null;
  try { p = sessionStorage.getItem('ll-portail') || localStorage.getItem('ll-portail'); } catch (e) {}
  document.documentElement.style.visibility = 'hidden';
  if (p) llCharger(p).catch(function () { location.replace('/'); });
  else location.replace('/');
})();
</script>
</head>
