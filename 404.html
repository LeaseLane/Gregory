<script src="/assets/charger-portail.js?v=202609272040"></script>
<script>
// /app/<onglet> n'existe pas comme fichier : on recharge le dernier portail
// ouvert, qui lit l'onglet dans l'adresse (assets/url-propre.js).
(function () {
  if (!/^\/app\//.test(location.pathname)) return;
  var p = null;
  try { p = sessionStorage.getItem('ll-portail') || localStorage.getItem('ll-portail'); } catch (e) {}
  document.documentElement.style.visibility = 'hidden';
  if (p) llCharger(p).catch(function () { location.replace('/app'); });
  else location.replace('/app');
})();
</script>
</head>

  </main>
</body>
