<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<!-- Page vierge à la demande du client (2026-09-16). La vitrine est
     conservée telle quelle dans site-vitrine.html : pour la remettre en
     ligne, `git mv site-vitrine.html index.html`.

     Ce qui reste volontairement en service, parce que rien de tout cela
     ne dépend de cette page :
       - le DNS et les portails (portail-*.html, app.html, pro.html…)
       - la livraison de courriel (Resend valide le domaine, pas le site)
       - les alertes de santé du lot P8

     `noindex` demande aux moteurs de retirer la page de leurs résultats.
     Sans cette balise, l'ancienne vitrine resterait affichée dans les
     résultats de recherche pendant des semaines — donc encore visible
     alors que le site est vide. -->
<meta name="robots" content="noindex, nofollow">
<style>
  html, body { height: 100%; margin: 0; background: #fff; }
</style>
</head>
<body></body>
</html>
